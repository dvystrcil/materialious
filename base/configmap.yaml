apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/part-of: materialious
    app.kubernetes.io/name: materialious-configmap
    app.kubernetes.io/component: configmap
  annotations:
    reloader.stakater.com/auto: "true"
  name: materialious-configmap
  namespace: materialious
data:
  PUBLIC_INTERNAL_AUTH: "false"
  PUBLIC_REQUIRE_AUTH: "false"
  PUBLIC_REGISTRATION_ALLOWED: "false"
  PUBLIC_CAPTCHA_DISABLED: "true"
  PUBLIC_DANGEROUS_ALLOW_ANY_PROXY: "false"
  # Our real deployed Invidious instance (homelab#848). Must be a
  # browser-reachable URL, not internal cluster DNS -- confirmed by
  # reading src/lib/images.ts: thumbnail <img src> uses this value
  # directly (native browser image load, NOT proxied through the
  # fetch/XHR monkeypatch that covers API/video traffic), so it has to
  # resolve from the client's own browser.
  PUBLIC_DEFAULT_INVIDIOUS_INSTANCE: "https://invidious.sirddail.net"
  # Invidious has a built-in reverse proxy for companion (confirmed in
  # config.cr/routes/companion.cr): when public_url is left unset,
  # Invidious registers real /companion/* routes on itself that
  # stream-proxy to the companion service. No separate public hostname
  # needed for companion -- ytvids-api.sirddail.net was an earlier,
  # since-reverted approach (homelab#849) that never actually landed in
  # this ConfigMap despite the PR being merged, causing a real live bug:
  # every video failed with a 500 from a nonexistent host. Confirmed via
  # the browser's own DevTools console (2026-08-07) before fixing this.
  PUBLIC_DEFAULT_COMPANION_INSTANCE: "https://invidious.sirddail.net/companion"
  # Public community services, matching upstream's own docker-compose
  # example defaults (docs/DOCKER.md) -- SponsorBlock and DeArrow both
  # directly serve the "reduce manipulative content" goal (homelab#848's
  # reframed goal), so left enabled rather than disabled for
  # privacy-minimalism.
  PUBLIC_DEFAULT_RETURNYTDISLIKES_INSTANCE: "https://returnyoutubedislikeapi.com"
  PUBLIC_DEFAULT_SPONSERBLOCK_INSTANCE: "https://sponsor.ajay.app"
  PUBLIC_DEFAULT_DEARROW_INSTANCE: "https://sponsor.ajay.app"
  PUBLIC_DEFAULT_DEARROW_THUMBNAIL_INSTANCE: "https://dearrow-thumb.ajay.app"
